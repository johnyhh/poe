                const merchant = transaction['商家'] || transaction['商戶'] || transaction['收款方'] || '';
                
                html += '<div class="text-sm border-b border-gray-100 dark:border-gray-700 pb-2 mb-2 last:border-b-0 last:pb-0 last:mb-0">';
                html += `<div class="font-medium text-base mb-1">${amount} <span class="text-xs text-gray-500 dark:text-gray-400">• ${date}</span></div>`;
                
                // 顯示類別
                if (category !== content) {
                    html += `<div class="text-gray-600 dark:text-gray-400 text-xs mb-1">📂 ${category}</div>`;
                }
                
                // 顯示交易描述
                if (description && description !== content) {
                    html += `<div class="text-gray-700 dark:text-gray-300 mb-1 leading-tight">${description}</div>`;
                }
                
                // 顯示商家信息
                if (merchant && merchant !== content) {
                    html += `<div class="text-gray-600 dark:text-gray-400 text-xs mb-1">🏪 ${merchant}</div>`;
                }
                
                // 顯示帳戶信息
                if (account) {
                    html += `<div class="text-gray-600 dark:text-gray-400 text-xs mb-1">💳 ${account}</div>`;
                }
                
                // 顯示備註
                if (memo && memo !== content) {
                    html += `<div class="text-gray-500 dark:text-gray-500 text-xs mb-1">📝 ${memo}</div>`;
                }
                
                html += '</div>';
            });
            html += '</div>';
            
            // 如果有更多記錄
            if (filteredTransactions.length > maxDisplay) {
                html += `<div class="text-xs text-gray-500 dark:text-gray-500 mt-2 pt-2 border-t border-gray-200 dark:border-gray-600">還有 ${filteredTransactions.length - maxDisplay} 筆記錄...</div>`;
            }
            
            // 顯示日期分佈（最多顯示前5個日期）
            if (uniqueDates > 1) {
                const sortedDates = Object.keys(dateGroups).sort();
                const displayDates = sortedDates.slice(0, 5);
                html += '<div class="text-xs text-gray-500 dark:text-gray-500 mt-2 pt-2 border-t border-gray-200 dark:border-gray-600">';
                html += '<div class="mb-1">交易日期分佈:</div>';
                displayDates.forEach(date => {
                    const count = dateGroups[date].length;
                    const dateTotal = dateGroups[date].reduce((sum, t) => sum + Math.abs(t.amount), 0);
                    html += `<div>• ${date}: ${count}筆 (${formatAmount(dateTotal)})</div>`;
                });
                if (sortedDates.length > 5) {
                    html += `<div>... 還有 ${sortedDates.length - 5} 個日期</div>`;
                }
                html += '</div>';
            }
            
            html += '<div class="text-xs text-blue-600 dark:text-blue-400 mt-2 pt-2 border-t border-gray-200 dark:border-gray-600">點擊行查看/編輯詳細資料</div>';
            
            tooltipContent.innerHTML = html;
            
            // 定位工具提示（使用滑鼠位置）
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            
            // 獲取工具提示尺寸
            tooltip.style.visibility = 'hidden';
            tooltip.style.display = 'block';
            const tooltipRect = tooltip.getBoundingClientRect();
            tooltip.style.visibility = 'visible';
            tooltip.style.display = '';
            
            // 計算位置，優先顯示在滑鼠右側
            let left = mouseX + 15;
            let top = mouseY - tooltipRect.height / 2;
            
            // 檢查是否會超出右邊界，如果會則顯示在左側
            if (left + tooltipRect.width > window.innerWidth - 10) {
                left = mouseX - tooltipRect.width - 15;
            }
            
            // 檢查上下邊界
            if (top < 10) {
                top = 10;
            } else if (top + tooltipRect.height > window.innerHeight - 10) {
                top = window.innerHeight - tooltipRect.height - 10;
            }
            
            // 調整箭頭位置
            const arrow = tooltip.querySelector('.tooltip-arrow');
            if (left < mouseX) {
                // 工具提示在滑鼠左側，箭頭在右邊
                arrow.style.left = 'auto';
                arrow.style.right = '20px';
            } else {
                // 工具提示在滑鼠右側，箭頭在左邊
                arrow.style.left = '20px';
                arrow.style.right = 'auto';
            }
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.classList.add('show');
        }

        function hideTooltip() {
            if (tooltip) {
                tooltip.classList.remove('show');
            }
        }

        // AI智能分組相關元素和功能
        const aiGroupBtn = document.getElementById('aiGroupBtn');
        const aiGroupModal = document.getElementById('aiGroupModal');
        const closeAiGroupModal = document.getElementById('closeAiGroupModal');
        const cancelAiGroup = document.getElementById('cancelAiGroup');
        const applyAiGroup = document.getElementById('applyAiGroup');
        const retryAiGroup = document.getElementById('retryAiGroup');
        const selectAllMappingsBtn = document.getElementById('selectAllMappings');
        const deselectAllMappingsBtn = document.getElementById('deselectAllMappings');
        
        const aiAnalysisProgress = document.getElementById('aiAnalysisProgress');
        const aiGroupResults = document.getElementById('aiGroupResults');
        const aiGroupError = document.getElementById('aiGroupError');
        const aiGroupSummary = document.getElementById('aiGroupSummary');
        const aiGroupMappings = document.getElementById('aiGroupMappings');
        const aiGroupErrorMessage = document.getElementById('aiGroupErrorMessage');

        // AI分組功能變數
        let currentAiMappings = [];

        // AI智能分組功能
        async function startAiGrouping() {
            if (allTransactions.length === 0) {
                showError('請先上傳和解析交易記錄檔案');
                return;
            }

            // 收集所有商戶名稱和交易內容，優先考慮商戶相關字段
            const allMerchants = new Set();
            allTransactions.forEach(t => {
                // 優先使用商戶相關字段
                const merchant = t['商家'] || t['商戶'] || t['收款方'] || 
                               t['交易內容'] || t['內容'] || t['交易描述'] || t['描述'] || 
                               t['備註'] || t['備注'] || '未分類';
                
                if (merchant && merchant.trim() && merchant !== '未分類') {
                    allMerchants.add(merchant.trim());
                }
            });

            const merchantList = Array.from(allMerchants);
            
            if (merchantList.length < 3) {
                showError('商戶名稱數量太少，無法進行智能分組 (至少需要3個不同的商戶)');
                return;
            }

            // 顯示模態框和進度指示器
            aiGroupModal.classList.remove('hidden');
            showAiProgress();

            try {
                // 準備AI分析的提示詞，專注於商戶名稱分組
                const prompt = `${activeAiModelMention} 分析以下商戶名稱和交易內容，根據商戶名稱的相似性進行智能分組。請只返回JSON格式的結果，不要添加任何解釋文字或代碼塊標記。

商戶名稱列表：
${merchantList.map((merchant, index) => `${index + 1}. ${merchant}`).join('\n')}

請分析這些商戶名稱，找出代表同一商戶或相關商戶的不同表達方式，並提供分組建議。返回格式如下：
{
  "summary": "分析摘要，說明找到了多少個商戶分組和主要的分組邏輯",
  "groups": [
    {
      "groupName": "統一的商戶名稱",
      "items": ["原始商戶名1", "原始商戶名2"],
      "reason": "為什麼這些商戶名稱應該分在一組的原因"
    }
  ]
}

商戶分組規則：
1. 重點關注商戶名稱的相似性，而非消費類別
2. 合併同一商戶的不同名稱表達（如：麥當勞、McDonald's、麥當勞餐廳）
3. 合併同一品牌的不同分店（如：7-ELEVEN 中環店、7-11 金鐘店）
4. 合併名稱相近的同類商戶（如：百佳、PARKnSHOP）
5. 每組至少要有2個項目
6. 分組名稱應該使用最常見或最正式的商戶名稱
7. 不要將不同商戶強行分組
8. 最多建議15個分組`;

                // 註冊AI響應處理器
                window.Poe.registerHandler('ai-grouping-handler', (result, context) => {
                    handleAiGroupingResponse(result);
                });

                // 發送消息給AI
                await window.Poe.sendUserMessage(prompt, {
                    handler: 'ai-grouping-handler',
                    stream: false,
                    openChat: false
                });

            } catch (error) {
                console.error('AI分組請求失敗:', error);
                showAiError('發送AI請求失敗: ' + error.message);
            }
        }

        function handleAiGroupingResponse(result) {
            try {
                const message = result.responses[0];
                
                if (message.status === 'error') {
                    showAiError('AI分析失敗: ' + (message.statusText || '未知錯誤'));
                    return;
                }
                
                if (message.status === 'incomplete') {
                    // 仍在處理中，保持進度指示器
                    return;
                }
                
                if (message.status === 'complete') {
                    try {
                        // 解析AI返回的JSON
                        let jsonContent = message.content.trim();
                        
                        // 移除可能的代碼塊標記
                        if (jsonContent.startsWith('```json')) {
                            jsonContent = jsonContent.substring(7);
                        }
                        if (jsonContent.startsWith('```')) {
                            jsonContent = jsonContent.substring(3);
                        }
                        if (jsonContent.endsWith('```')) {
                            jsonContent = jsonContent.substring(0, jsonContent.length - 3);
                        }
                        
                        const aiResponse = JSON.parse(jsonContent);
                        
                        if (!aiResponse.groups || !Array.isArray(aiResponse.groups)) {
                            throw new Error('AI返回的數據格式不正確');
                        }
                        
                        // 處理AI分組結果
                        processAiGroupingResults(aiResponse);
                        
                    } catch (parseError) {
                        console.error('解析AI響應失敗:', parseError);
                        console.log('AI原始響應:', message.content);
                        showAiError('解析AI響應失敗: ' + parseError.message + '\n\n原始響應:\n' + message.content);
                    }
                }
                
            } catch (error) {
                console.error('處理AI響應時發生錯誤:', error);
                showAiError('處理AI響應時發生錯誤: ' + error.message);
            }
        }

        function processAiGroupingResults(aiResponse) {
            // 驗證和準備分組映射
            currentAiMappings = [];
            
            aiResponse.groups.forEach((group, index) => {
                if (!group.items || !Array.isArray(group.items) || group.items.length < 2) {
                    return; // 跳過無效的分組
                }
                
                // 驗證所有項目都存在於原始數據中
                const validItems = group.items.filter(item => {
                    return allTransactions.some(t => {
                        const content = t['交易內容'] || t['內容'] || t['交易描述'] || t['描述'] || 
                                       t['商家'] || t['商戶'] || t['收款方'] || t['備註'] || t['備注'] || 
                                       '未分類';
                        return content.trim() === item.trim();
                    });
                });
                
                if (validItems.length >= 2) {
                    currentAiMappings.push({
                        id: `group-${index}`,
                        groupName: group.groupName || `分組 ${index + 1}`,
                        items: validItems,
                        reason: group.reason || '無說明',
                        selected: true // 預設選中
                    });
                }
            });

            // 顯示結果
            if (currentAiMappings.length === 0) {
                showAiError('AI未找到可以合併的類似內容');
                return;
            }

            displayAiGroupingResults(aiResponse.summary || `找到 ${currentAiMappings.length} 個建議分組`);
        }

        function displayAiGroupingResults(summary) {
            // 顯示摘要
            aiGroupSummary.innerHTML = summary;
            
            // 顯示分組映射
            let mappingsHtml = '';
            
            currentAiMappings.forEach((mapping, index) => {
                const itemCount = mapping.items.length;
                const affectedTransactions = countAffectedTransactions(mapping.items);
                
                mappingsHtml += `
                    <div class="border border-gray-200 dark:border-gray-600 rounded-lg p-4 ${mapping.selected ? 'bg-blue-50 dark:bg-blue-900/20' : 'bg-gray-50 dark:bg-gray-800'}">
                        <div class="flex items-start space-x-3">
                            <input type="checkbox" 
                                   id="mapping-${mapping.id}" 
                                   ${mapping.selected ? 'checked' : ''} 
                                   onchange="toggleMapping('${mapping.id}')"
                                   class="mt-1 text-purple-600 focus:ring-purple-500">
                            
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <label for="mapping-${mapping.id}" class="font-semibold cursor-pointer">
                                            分組名稱: 
                                        </label>
                                        <input type="text" 
                                               value="${mapping.groupName}" 
                                               onchange="updateGroupName('${mapping.id}', this.value)"
                                               class="ml-2 px-2 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700">
                                    </div>
                                    <div class="text-sm text-gray-500 dark:text-gray-400">
                                        ${itemCount} 個項目 • ${affectedTransactions} 筆交易
                                    </div>
                                </div>
                                
                                <div class="text-sm text-gray-600 dark:text-gray-400 mb-3">
                                    <strong>分組理由:</strong> ${mapping.reason}
                                </div>
                                
                                <div class="space-y-2">
                                    <div class="text-sm font-medium text-gray-700 dark:text-gray-300">將要合併的項目:</div>
                                    <div class="grid grid-cols-1 gap-2">
                                        ${mapping.items.map((item, itemIndex) => {
                                            const transactionCount = countTransactionsForContent(item);
                                            return `
                                                <div class="flex justify-between items-center p-2 bg-white dark:bg-gray-700 rounded border group">
                                                    <span class="text-sm flex-1">${item}</span>
                                                    <div class="flex items-center space-x-2">
                                                        <span class="text-xs text-gray-500 dark:text-gray-400">${transactionCount} 筆</span>
                                                        <button onclick="removeItemFromMapping('${mapping.id}', '${item.replace(/'/g, "\\'")}')" 
                                                                class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 text-red-500 hover:text-red-700 text-xs px-2 py-1 rounded hover:bg-red-50 dark:hover:bg-red-900/20"
                                                                title="從此分組中移除">
                                                            ✕
                                                        </button>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                                
                                <div class="mt-3 text-xs text-gray-500 dark:text-gray-500">
                                    → 合併後將全部顯示為: <span class="font-medium">"${mapping.groupName}"</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            aiGroupMappings.innerHTML = mappingsHtml;
            
            // 顯示結果區域，隱藏進度和錯誤
            showAiResults();
        }

        function countAffectedTransactions(items) {
            return allTransactions.filter(t => {
                const content = t['交易內容'] || t['內容'] || t['交易描述'] || t['描述'] || 
                               t['商家'] || t['商戶'] || t['收款方'] || t['備註'] || t['備注'] || 
                               '未分類';
                return items.includes(content.trim());
            }).length;
        }

        function countTransactionsForContent(contentItem) {
            return allTransactions.filter(t => {
                const content = t['交易內容'] || t['內容'] || t['交易描述'] || t['描述'] || 
                               t['商家'] || t['商戶'] || t['收款方'] || t['備註'] || t['備注'] || 
                               '未分類';
                return content.trim() === contentItem.trim();
            }).length;
        }

        function toggleMapping(mappingId) {
            const mapping = currentAiMappings.find(m => m.id === mappingId);
            if (mapping) {
                mapping.selected = !mapping.selected;
                
                // 更新視覺狀態
                const container = document.querySelector(`#mapping-${mappingId}`).closest('.border');
                if (mapping.selected) {
                    container.classList.remove('bg-gray-50', 'dark:bg-gray-800');
                    container.classList.add('bg-blue-50', 'dark:bg-blue-900/20');
                } else {
                    container.classList.remove('bg-blue-50', 'dark:bg-blue-900/20');
                    container.classList.add('bg-gray-50', 'dark:bg-gray-800');
                }
            }
        }

        function updateGroupName(mappingId, newName) {
            const mapping = currentAiMappings.find(m => m.id === mappingId);
            if (mapping) {
                mapping.groupName = newName.trim() || mapping.groupName;
            }
        }

        function selectAllAiMappings() {
            currentAiMappings.forEach(mapping => {
                mapping.selected = true;
                const checkbox = document.getElementById(`mapping-${mapping.id}`);
                if (checkbox) {
                    checkbox.checked = true;
                    const container = checkbox.closest('.border');
                    container.classList.remove('bg-gray-50', 'dark:bg-gray-800');
                    container.classList.add('bg-blue-50', 'dark:bg-blue-900/20');
                }
            });
        }

        function deselectAllAiMappings() {
            currentAiMappings.forEach(mapping => {
                mapping.selected = false;
                const checkbox = document.getElementById(`mapping-${mapping.id}`);
                if (checkbox) {
                    checkbox.checked = false;
                    const container = checkbox.closest('.border');
                    container.classList.remove('bg-blue-50', 'dark:bg-blue-900/20');
                    container.classList.add('bg-gray-50', 'dark:bg-gray-800');
                }
            });
        }

        function applyAiGroupings() {
            const selectedMappings = currentAiMappings.filter(m => m.selected);
            
            if (selectedMappings.length === 0) {
                showError('請選擇至少一個分組來應用');
                return;
            }

            // 應用分組映射到所有交易記錄
            let appliedCount = 0;
            
            selectedMappings.forEach(mapping => {
                const contentFields = ['交易內容', '內容', '交易描述', '描述', '商家', '商戶', '收款方', '備註', '備注'];
                
                allTransactions.forEach(transaction => {
                    contentFields.forEach(field => {
                        if (transaction[field] && mapping.items.includes(transaction[field].trim())) {
                            transaction[field] = mapping.groupName;
                            appliedCount++;
                        }
                    });
                });
            });

            // 重新渲染所有表格
            const { expenses, income } = categorizeTransactions(allTransactions);
            renderPivotTable(expenses, expenseTable, '支出');
            renderPivotTable(income, incomeTable, '收入');
            renderContentRanking(expenses, expenseRanking, '支出');
            renderContentRanking(income, incomeRanking, '收入');

            // 關閉模態框
            closeAiGroupModalFunc();

            // 顯示成功訊息
            const message = `成功應用 ${selectedMappings.length} 個分組，影響 ${appliedCount} 筆交易記錄`;
            showTemporaryMessage(message, 'success');
        }

        function showTemporaryMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white transition-all duration-300 transform translate-x-full ${
                type === 'success' ? 'bg-green-500' : 
                type === 'error' ? 'bg-red-500' : 
                'bg-blue-500'
            }`;
            messageDiv.textContent = message;
            
            document.body.appendChild(messageDiv);
            
            // 滑入動畫
            setTimeout(() => {
                messageDiv.classList.remove('translate-x-full');
            }, 100);
            
            // 自動消失
            setTimeout(() => {
                messageDiv.classList.add('translate-x-full');
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.parentNode.removeChild(messageDiv);
                    }
                }, 300);
            }, 3000);
        }

        function showAiProgress() {
            aiAnalysisProgress.classList.remove('hidden');
            aiGroupResults.classList.add('hidden');
            aiGroupError.classList.add('hidden');
        }

        function showAiResults() {
            aiAnalysisProgress.classList.add('hidden');
            aiGroupResults.classList.remove('hidden');
            aiGroupError.classList.add('hidden');
        }

        function showAiError(errorMessage) {
            aiGroupErrorMessage.textContent = errorMessage;
            aiAnalysisProgress.classList.add('hidden');
            aiGroupResults.classList.add('hidden');
            aiGroupError.classList.remove('hidden');
        }

        function removeItemFromMapping(mappingId, itemToRemove) {
            const mapping = currentAiMappings.find(m => m.id === mappingId);
            if (!mapping) return;
            
            // 移除項目
            mapping.items = mapping.items.filter(item => item !== itemToRemove);
            
            // 如果分組項目少於2個，則取消選中並禁用
            if (mapping.items.length < 2) {
                mapping.selected = false;
                showTemporaryMessage(`分組 "${mapping.groupName}" 項目太少已被取消選中`, 'info');
            }
            
            // 重新渲染該分組的顯示
            displayAiGroupingResults(aiGroupSummary.textContent);
        }

        function closeAiGroupModalFunc() {
            aiGroupModal.classList.add('hidden');
            currentAiMappings = [];
        }

        // AI分組事件監聽器
        aiGroupBtn.addEventListener('click', startAiGrouping);
        closeAiGroupModal.addEventListener('click', closeAiGroupModalFunc);
        cancelAiGroup.addEventListener('click', closeAiGroupModalFunc);
        applyAiGroup.addEventListener('click', applyAiGroupings);
        retryAiGroup.addEventListener('click', startAiGrouping);
        selectAllMappingsBtn.addEventListener('click', selectAllAiMappings);
        deselectAllMappingsBtn.addEventListener('click', deselectAllAiMappings);

        // 點擊模態框外部關閉
        aiGroupModal.addEventListener('click', (e) => {
            if (e.target === aiGroupModal) {
                closeAiGroupModalFunc();
            }
        });

        // 過濾器事件監聽器
        applyFilters.addEventListener('click', applyFilterSettings);
        exportSettingsBtn.addEventListener('click', exportFilterSettings);
        importSettingsInput.addEventListener('change', importFilterSettings);
        resetSettingsBtn.addEventListener('click', resetFilterSettings);

        // ===== App 啟動時自動載入 LLM configure（新增）=====
        loadLlmConfigOnStartup();
    </script>
</body>
</html>
