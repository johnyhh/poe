function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function formatTime(seconds) {
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// =============================================
// FONT SIZE CONTROL
// =============================================
var fontScale = 1;

function adjustFontSize(delta) {
  fontScale = Math.round(Math.max(0.6, Math.min(2.0, fontScale + delta)) * 10) / 10;
  applyFontScale();
}

function resetFontScale() {
  fontScale = 1;
  applyFontScale();
  showToast('字體大小已重設', 'info');
}

function applyFontScale() {
  var s = fontScale;
  var label = document.getElementById('fontScaleLabel');
  if (label) label.textContent = Math.round(s * 100) + '%';

  // When scale is 1 (default), clear all inline overrides to let CSS/media queries handle sizing
  if (s === 1) {
    clearFontScaleStyles();
    return;
  }

  // Timer ring
  var ring = document.querySelector('.timer-ring-container');
  if (ring) {
    ring.style.width = (200 * s) + 'px';
    ring.style.height = (200 * s) + 'px';
  }

  // Breath circle
  var bc = document.getElementById('breathCircle');
  if (bc) {
    bc.style.width = (64 * s) + 'px';
    bc.style.height = (64 * s) + 'px';
  }

  // Countdown text
  var cd = document.getElementById('timerCountdown');
  if (cd) cd.style.fontSize = (46 * s) + 'px';

  // Step title in ring
  var st = document.getElementById('timerStepTitle');
  if (st) st.style.fontSize = (13 * s) + 'px';

  // Breath label
  var bl = document.getElementById('breathLabel');
  if (bl) bl.style.fontSize = (16 * s) + 'px';

  // Breath hint
  var bh = document.getElementById('breathHint');
  if (bh) bh.style.fontSize = (13 * s) + 'px';

  // Round label
  var rl = document.getElementById('breathRoundLabel');
  if (rl) rl.style.fontSize = (14 * s) + 'px';

  // Detail title (right column)
  var dt = document.getElementById('timerDetailTitle');
  if (dt) dt.style.fontSize = (16 * s) + 'px';

  // Step description
  var sd = document.getElementById('timerStepDesc');
  if (sd) sd.style.fontSize = (14 * s) + 'px';

  // Sub steps
  var ss = document.getElementById('timerSubSteps');
  if (ss) ss.style.fontSize = (13 * s) + 'px';

  // Step notes
  var sn = document.getElementById('timerStepNotes');
  if (sn) sn.style.fontSize = (12 * s) + 'px';

  // Step list in left column
  var stepItems = document.querySelectorAll('.step-indicator');
  stepItems.forEach(function(item) {
    item.style.fontSize = (12 * s) + 'px';
  });
}

function clearFontScaleStyles() {
  var ring = document.querySelector('.timer-ring-container');
  if (ring) { ring.style.width = ''; ring.style.height = ''; }

  var bc = document.getElementById('breathCircle');
  if (bc) { bc.style.width = ''; bc.style.height = ''; }

  var els = [
    'timerCountdown', 'timerStepTitle', 'breathLabel',
    'breathHint', 'breathRoundLabel', 'timerDetailTitle',
    'timerStepDesc', 'timerSubSteps', 'timerStepNotes'
  ];
  els.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.fontSize = '';
  });

  var stepItems = document.querySelectorAll('.step-indicator');
  stepItems.forEach(function(item) { item.style.fontSize = ''; });
}

// =============================================
// MANUAL EDITOR
// =============================================
var ManualEditorState = {
  steps: [],
  editingProgramId: null
};

function startManualCreate() {
  showScreen('manual');
  initManualEditor(null);
}

function editProgramManually(id) {
  showScreen('manual');
  initManualEditor(id);
}

function initManualEditor(existingProgId) {
  ManualEditorState.editingProgramId = existingProgId || null;

  if (existingProgId) {
    var prog = AppState.programs.find(function(p) { return p.id === existingProgId; });
    if (prog) {
      document.getElementById('manualProgName').value = prog.programName || '';
      document.getElementById('manualProgDesc').value = prog.description || '';
      ManualEditorState.steps = JSON.parse(JSON.stringify(prog.steps || []));
    }
  } else {
    document.getElementById('manualProgName').value = '';
    document.getElementById('manualProgDesc').value = '';
    ManualEditorState.steps = [];
  }

  renderManualSteps();
}

function addManualStep() {
  syncAllManualSteps();
  ManualEditorState.steps.push({
    id: Date.now(),
    title: '',
    durationSeconds: 60,
    description: '',
    subSteps: [],
    repetitions: null,
    breathingPattern: null,
    actionCycles: null,
    notes: null
  });
  renderManualSteps();

  setTimeout(function() {
    var list = document.getElementById('manualStepList');
    var lastStep = list.lastElementChild;
    if (lastStep) {
      lastStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var titleInput = lastStep.querySelector('.manual-step-title');
      if (titleInput) titleInput.focus();
    }
  }, 80);
}

function removeManualStep(idx) {
  ManualEditorState.steps.splice(idx, 1);
  renderManualSteps();
}

function removeManualStepUI(idx) {
  syncAllManualSteps();
  removeManualStep(idx);
}

function moveManualStep(fromIdx, toIdx) {
  if (toIdx < 0 || toIdx >= ManualEditorState.steps.length) return;
  var item = ManualEditorState.steps.splice(fromIdx, 1)[0];
  ManualEditorState.steps.splice(toIdx, 0, item);
  renderManualSteps();
}

function moveManualStepUI(fromIdx, toIdx) {
  syncAllManualSteps();
  moveManualStep(fromIdx, toIdx);
}

function syncManualStepFromDOM(idx) {
  var container = document.getElementById('manualStepList');
  var cards = container.querySelectorAll('.manual-editor-step');
  if (!cards[idx]) return;

  var card = cards[idx];
  var step = ManualEditorState.steps[idx];
  if (!step) return;

  var titleEl = card.querySelector('.manual-step-title');
  if (titleEl) step.title = titleEl.value || '';

  var minEl = card.querySelector('.manual-step-min');
  var secEl = card.querySelector('.manual-step-sec');
  var minVal = minEl ? (parseInt(minEl.value) || 0) : 0;
  var secVal = secEl ? (parseInt(secEl.value) || 0) : 0;
  step.durationSeconds = Math.max(1, minVal * 60 + secVal);

  var descEl = card.querySelector('.manual-step-desc');
  if (descEl) step.description = descEl.value || '';

  var subsEl = card.querySelector('.manual-step-subs');
  if (subsEl) {
    var subText = subsEl.value || '';
    step.subSteps = subText.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
  }

  var repsEl = card.querySelector('.manual-step-reps');
  if (repsEl) {
    step.repetitions = repsEl.value ? (parseInt(repsEl.value) || null) : null;
  }

  var notesEl = card.querySelector('.manual-step-notes');
  if (notesEl) step.notes = notesEl.value || null;
}

function syncAllManualSteps() {
  for (var i = 0; i < ManualEditorState.steps.length; i++) {
    syncManualStepFromDOM(i);
  }
}

function updateManualTotalTime() {
  syncAllManualSteps();
  var total = ManualEditorState.steps.reduce(function(s, step) {
    return s + (step.durationSeconds || 0);
  }, 0);
  var min = Math.floor(total / 60);
  var sec = total % 60;
  var label = min > 0 ? min + ' 分' : '';
  if (sec > 0) label += (label ? ' ' : '') + sec + ' 秒';
  if (!label) label = '0 分鐘';
  document.getElementById('manualTotalTime').innerHTML = '<i class="fas fa-clock" style="margin-right:4px;"></i>' + label;
}

function escapeAttr(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderManualSteps() {
  var container = document.getElementById('manualStepList');
  var emptyEl = document.getElementById('manualEmptyState');
  var steps = ManualEditorState.steps;

  if (steps.length === 0) {
    container.innerHTML = '';
    emptyEl.style.display = '';
    updateManualTotalTime();
    return;
  }

  emptyEl.style.display = 'none';
  var html = '';

  steps.forEach(function(step, idx) {
    var minutes = Math.floor((step.durationSeconds || 0) / 60);
    var seconds = (step.durationSeconds || 0) % 60;
    var subStepsText = (step.subSteps || []).join('\n');
    var isFirst = idx === 0;
    var isLast = idx === steps.length - 1;

    html +=
      '<div class="manual-editor-step" data-idx="' + idx + '">' +
        '<div class="manual-step-left-col">' +
          '<div class="manual-step-num">' + (idx + 1) + '</div>' +
          '<div class="drag-handle" data-idx="' + idx + '" title="拖拽排序">' +
            '<i class="fas fa-grip-vertical"></i>' +
          '</div>' +
          '<div class="step-move-btns">' +
            '<button class="step-move-btn" onclick="moveManualStepUI(' + idx + ',' + (idx - 1) + ')" ' + (isFirst ? 'disabled' : '') + ' title="上移">' +
              '<i class="fas fa-chevron-up"></i>' +
            '</button>' +
            '<button class="step-move-btn" onclick="moveManualStepUI(' + idx + ',' + (idx + 1) + ')" ' + (isLast ? 'disabled' : '') + ' title="下移">' +
              '<i class="fas fa-chevron-down"></i>' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="manual-step-fields">' +
          '<div class="manual-step-row">' +
            '<input class="input manual-step-title" type="text" placeholder="步驟標題（必填）" value="' + escapeAttr(step.title || '') + '" oninput="syncManualStepFromDOM(' + idx + ')" style="font-weight:600;" />' +
            '<button class="step-remove-btn" onclick="removeManualStepUI(' + idx + ')" title="刪除此步驟">' +
              '<i class="fas fa-trash"></i>' +
            '</button>' +
          '</div>' +
          '<div class="manual-step-row">' +
            '<div class="time-input-group">' +
              '<span class="time-label"><i class="fas fa-hourglass-half" style="margin-right:3px;"></i>時長：</span>' +
              '<input class="input manual-step-min" type="number" min="0" max="99" value="' + minutes + '" onchange="updateManualTotalTime()" style="width:60px;text-align:center;padding:8px 4px;" />' +
              '<span class="time-label">分</span>' +
              '<input class="input manual-step-sec" type="number" min="0" max="59" value="' + seconds + '" onchange="updateManualTotalTime()" style="width:60px;text-align:center;padding:8px 4px;" />' +
              '<span class="time-label">秒</span>' +
            '</div>' +
            '<div class="time-input-group">' +
              '<span class="time-label">重複：</span>' +
              '<input class="input manual-step-reps" type="number" min="0" max="999" value="' + (step.repetitions || '') + '" placeholder="—" onchange="syncManualStepFromDOM(' + idx + ')" style="width:60px;text-align:center;padding:8px 4px;" />' +
              '<span class="time-label">次</span>' +
            '</div>' +
          '</div>' +
          '<input class="input manual-step-desc" type="text" placeholder="步驟說明（選填）" value="' + escapeAttr(step.description || '') + '" oninput="syncManualStepFromDOM(' + idx + ')" />' +
          '<textarea class="input manual-step-subs" rows="2" placeholder="子步驟（每行一項，選填）" style="resize:vertical;min-height:50px;line-height:1.6;">' + escapeHtml(subStepsText) + '</textarea>' +
          '<input class="input manual-step-notes" type="text" placeholder="注意事項（選填）" value="' + escapeAttr(step.notes || '') + '" oninput="syncManualStepFromDOM(' + idx + ')" />' +
        '</div>' +
      '</div>';
  });

  container.innerHTML = html;
  updateManualTotalTime();
  initDragAndDrop();
}

function saveManualProgram() {
  syncAllManualSteps();

  var name = document.getElementById('manualProgName').value.trim();
  var desc = document.getElementById('manualProgDesc').value.trim();

  if (!name) {
    showToast('請輸入程序名稱', 'error');
    document.getElementById('manualProgName').focus();
    return;
  }

  if (ManualEditorState.steps.length === 0) {
    showToast('請至少新增一個步驟', 'error');
    return;
  }

  for (var i = 0; i < ManualEditorState.steps.length; i++) {
    if (!ManualEditorState.steps[i].title.trim()) {
      showToast('步驟 ' + (i + 1) + ' 缺少標題', 'error');
      return;
    }
  }

  var totalSec = ManualEditorState.steps.reduce(function(s, st) { return s + (st.durationSeconds || 0); }, 0);
  var finalSteps = ManualEditorState.steps.map(function(s, i) {
    var copy = JSON.parse(JSON.stringify(s));
    copy.id = i;
    return copy;
  });

  if (ManualEditorState.editingProgramId) {
    var existing = AppState.programs.find(function(p) { return p.id === ManualEditorState.editingProgramId; });
    if (existing) {
      existing.programName = name;
      existing.description = desc;
      existing.totalEstimatedSeconds = totalSec;
      existing.steps = finalSteps;
      showToast('程序已更新！', 'success');
      viewProgram(existing.id);
    }
  } else {
    var prog = {
      id: 'prog-' + Date.now(),
      programName: name,
      description: desc,
      totalEstimatedSeconds: totalSec,
      isDefault: false,
      createdAt: new Date().toISOString(),
      steps: finalSteps
    };
    AppState.programs.push(prog);
    showToast('程序已儲存！', 'success');
    viewProgram(prog.id);
  }
}

// =============================================
// DRAG AND DROP (pointer events for mouse+touch)
// =============================================
var DragCtx = {
  active: false,
  idx: -1,
  clone: null,
  startY: 0,
  offsetY: 0,
  container: null,
  items: [],
  currentDropIdx: -1
};

function initDragAndDrop() {
  var handles = document.querySelectorAll('#manualStepList .drag-handle');
  handles.forEach(function(handle) {
    handle.addEventListener('pointerdown', onDragStart);
  });
}

function onDragStart(e) {
  e.preventDefault();
  var handle = e.currentTarget;
  var idx = parseInt(handle.getAttribute('data-idx'));
  var container = document.getElementById('manualStepList');
  var items = container.querySelectorAll('.manual-editor-step');
  var item = items[idx];
  if (!item) return;

  syncAllManualSteps();

  var rect = item.getBoundingClientRect();

  DragCtx.active = true;
  DragCtx.idx = idx;
  DragCtx.container = container;
  DragCtx.startY = e.clientY;
  DragCtx.offsetY = e.clientY - rect.top;
  DragCtx.currentDropIdx = idx;

  DragCtx.clone = item.cloneNode(true);
  DragCtx.clone.classList.add('drag-clone');
  DragCtx.clone.style.width = rect.width + 'px';
  DragCtx.clone.style.left = rect.left + 'px';
  DragCtx.clone.style.top = (e.clientY - DragCtx.offsetY) + 'px';
  document.body.appendChild(DragCtx.clone);

  item.classList.add('dragging');

  DragCtx.items = [];
  items.forEach(function(el, i) {
    var r = el.getBoundingClientRect();
    DragCtx.items.push({ el: el, idx: i, top: r.top, bottom: r.bottom, mid: (r.top + r.bottom) / 2 });
  });

  handle.setPointerCapture(e.pointerId);
  handle.addEventListener('pointermove', onDragMove);
  handle.addEventListener('pointerup', onDragEnd);
  handle.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
  if (!DragCtx.active) return;
  e.preventDefault();

  DragCtx.clone.style.top = (e.clientY - DragCtx.offsetY) + 'px';

  // Determine drop index: count items whose midpoint is above the cursor
  var insertBefore = ManualEditorState.steps.length;
  for (var i = 0; i < DragCtx.items.length; i++) {
    if (i === DragCtx.idx) continue;
    if (e.clientY < DragCtx.items[i].mid) {
      insertBefore = i;
      break;
    }
  }

  var toIdx;
  if (insertBefore > DragCtx.idx) {
    toIdx = insertBefore - 1;
  } else {
    toIdx = insertBefore;
  }
  toIdx = Math.max(0, Math.min(ManualEditorState.steps.length - 1, toIdx));
  DragCtx.currentDropIdx = toIdx;

  // Visual feedback
  DragCtx.items.forEach(function(item) {
    item.el.classList.remove('drop-before', 'drop-after');
  });

  if (toIdx !== DragCtx.idx) {
    if (toIdx < DragCtx.idx && DragCtx.items[toIdx]) {
      DragCtx.items[toIdx].el.classList.add('drop-before');
    } else if (toIdx > DragCtx.idx && DragCtx.items[toIdx]) {
      DragCtx.items[toIdx].el.classList.add('drop-after');
    }
  }
}

function onDragEnd(e) {
  if (!DragCtx.active) return;
  DragCtx.active = false;

  if (DragCtx.clone && DragCtx.clone.parentNode) {
    DragCtx.clone.parentNode.removeChild(DragCtx.clone);
  }

  DragCtx.items.forEach(function(item) {
    item.el.classList.remove('dragging', 'drop-before', 'drop-after');
  });

  var handle = e.currentTarget;
  if (handle) {
    handle.removeEventListener('pointermove', onDragMove);
    handle.removeEventListener('pointerup', onDragEnd);
    handle.removeEventListener('pointercancel', onDragEnd);
  }

  if (DragCtx.currentDropIdx !== DragCtx.idx && DragCtx.currentDropIdx >= 0) {
    moveManualStep(DragCtx.idx, DragCtx.currentDropIdx);
  }

  DragCtx.clone = null;
  DragCtx.items = [];
}

// =============================================
// IMPORT / EXPORT SETTINGS
// =============================================
function openSettingsModal() {
  var programCount = AppState.programs.length;
  var scaleLabel = Math.round(fontScale * 100) + '%';

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-box">' +
      '<div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">' +
        '<div style="width:40px;height:40px;border-radius:12px;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;">' +
          '<i class="fas fa-gear" style="font-size:18px;color:var(--accent);"></i>' +
        '</div>' +
        '<div>' +
          '<h3 style="font-size:18px; font-weight:700; line-height:1.2;">設定</h3>' +
          '<p style="font-size:12px; color:var(--text-muted);">匯入 / 匯出應用程式資料</p>' +
        '</div>' +
      '</div>' +

      '<div style="background:var(--bg-secondary);border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--border);">' +
        '<p style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">目前資料概覽</p>' +
        '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary);">' +
          '<span><i class="fas fa-dumbbell" style="margin-right:4px;color:var(--accent);"></i>' + programCount + ' 個程序</span>' +
          '<span><i class="fas fa-font" style="margin-right:4px;color:var(--accent);"></i>字體 ' + scaleLabel + '</span>' +
        '</div>' +
      '</div>' +

      '<div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">' +
        '<button class="btn btn-primary" id="settingsExportBtn" style="width:100%; justify-content:center;">' +
          '<i class="fas fa-file-export"></i> 匯出設定' +
        '</button>' +
        '<p style="font-size:12px; color:var(--text-muted); text-align:center; margin-top:-4px;">' +
          '將所有運動程序與偏好設定儲存為 JSON 檔案' +
        '</p>' +

        '<button class="btn btn-secondary" id="settingsImportBtn" style="width:100%; justify-content:center;">' +
          '<i class="fas fa-file-import"></i> 匯入設定' +
        '</button>' +
        '<p style="font-size:12px; color:var(--text-muted); text-align:center; margin-top:-4px;">' +
          '從 JSON 檔案還原運動程序與偏好設定' +
        '</p>' +
      '</div>' +

      '<div style="text-align:right;">' +
        '<button class="btn btn-secondary btn-sm" id="settingsCloseBtn">關閉</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(overlay);

  overlay.querySelector('#settingsExportBtn').onclick = function() {
    overlay.remove();
    exportSettings();
  };
  overlay.querySelector('#settingsImportBtn').onclick = function() {
    overlay.remove();
    triggerImport();
  };
  overlay.querySelector('#settingsCloseBtn').onclick = function() {
    overlay.remove();
  };
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
}

function exportSettings() {
  var data = {
    version: 1,
    appName: 'AI 運動計時器',
    exportDate: new Date().toISOString(),
    fontScale: fontScale,
    programs: AppState.programs
  };

  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'ai-exercise-timer-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('設定已匯出為 JSON 檔案', 'success');
}

function triggerImport() {
  var fileInput = document.getElementById('importFileInput');
  fileInput.value = '';
  fileInput.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data.programs || !Array.isArray(data.programs)) {
          throw new Error('無效的設定檔案：缺少 programs 欄位');
        }
        showImportConfirmModal(data, file.name);
      } catch (err) {
        showToast('匯入失敗：' + err.message, 'error');
      }
    };
    reader.onerror = function() {
      showToast('讀取檔案失敗', 'error');
    };
    reader.readAsText(file);
  };
  fileInput.click();
}

function showImportConfirmModal(data, fileName) {
  var programCount = data.programs ? data.programs.length : 0;
  var scaleLabel = data.fontScale ? Math.round(data.fontScale * 100) + '%' : '預設 (100%)';
  var dateLabel = data.exportDate ? new Date(data.exportDate).toLocaleString('zh-TW') : '未知';

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-box">' +
      '<h3 style="font-size:18px; font-weight:700; margin-bottom:12px;">' +
        '<i class="fas fa-file-import" style="margin-right:8px; color:var(--accent);"></i>確認匯入' +
      '</h3>' +

      '<div style="background:var(--bg-secondary);border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--border);">' +
        '<p style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">' +
          '<i class="fas fa-file-code" style="margin-right:6px;color:var(--accent);"></i>' + escapeHtml(fileName) +
        '</p>' +
        '<ul style="font-size:13px; color:var(--text-secondary); padding-left:20px; line-height:1.9; margin:0;">' +
          '<li>' + programCount + ' 個運動程序</li>' +
          '<li>字體大小：' + scaleLabel + '</li>' +
          '<li>匯出時間：' + dateLabel + '</li>' +
        '</ul>' +
      '</div>' +

      '<p style="font-size:13px; color:var(--ember); margin-bottom:20px; line-height:1.6;">' +
        '<i class="fas fa-exclamation-triangle" style="margin-right:4px;"></i>' +
        '此操作將<strong>覆蓋</strong>目前所有運動程序及設定，無法復原。' +
      '</p>' +

      '<div style="display:flex; gap:10px; justify-content:flex-end;">' +
        '<button class="btn btn-secondary btn-sm" id="importCancelBtn">取消</button>' +
        '<button class="btn btn-primary btn-sm" id="importConfirmBtn">' +
          '<i class="fas fa-check"></i> 確認匯入' +
        '</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(overlay);

  overlay.querySelector('#importConfirmBtn').onclick = function() {
    applyImportData(data);
    overlay.remove();
  };
  overlay.querySelector('#importCancelBtn').onclick = function() {
    overlay.remove();
  };
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
}

function applyImportData(data) {
  // Restore programs
  if (data.programs && Array.isArray(data.programs)) {
    AppState.programs = data.programs;
  }

  // Restore font scale
  if (typeof data.fontScale === 'number' && data.fontScale >= 0.6 && data.fontScale <= 2.0) {
    fontScale = Math.round(data.fontScale * 10) / 10;
  } else {
    fontScale = 1;
  }
  applyFontScale();

  // Re-render
  renderProgramList();
  showToast('設定已成功匯入！共載入 ' + AppState.programs.length + ' 個程序', 'success');
}

// =============================================
// DARK MODE DETECTION
// =============================================
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(event) {
  if (event.matches) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
});

// =============================================
// INIT
// =============================================
function init() {
  // Load default program
  AppState.programs = [getDefaultProgram()];

  // Render
  renderProgramList();

  // Load LLM config
  loadLLMConfig();
}

init();
</script>
</body>
</html>
